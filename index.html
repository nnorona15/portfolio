<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noelia Orona — Diseñadora</title>
<meta name="description" content="Noelia Orona — Diseñadora con base en Argentina. Identidad visual, diseño editorial, packaging y web.">
<meta property="og:title" content="Noelia Orona — Diseñadora">
<meta property="og:description" content="Identidades y experiencias visuales con concepto, sensibilidad y una mirada contemporánea.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231e1e1e'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' fill='white' text-anchor='middle'%3EN.O%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&amp;family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:inherit;text-decoration:none}a:hover{opacity:.6}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-transform:inherit;letter-spacing:inherit}
button:hover{opacity:.6}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:16px}
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:16px;align-items:start}
.code{text-align:right}
.strip{scrollbar-width:none;-ms-overflow-style:none}
.strip::-webkit-scrollbar{display:none}
.strip:focus-visible{outline:1px solid #1e1e1e;outline-offset:4px}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.92);color:#1e1e1e;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',ui-monospace,monospace;font-size:18px;box-shadow:0 1px 8px rgba(0,0,0,0.12);transition:transform .2s ease,opacity .2s ease}
.arr:hover{opacity:1;transform:translateY(-50%) scale(1.06)}
.lead{text-wrap:pretty}
.about,.lists{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:16px;row-gap:40px;align-items:start}
.about .txt{grid-column:span 2}
.contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:16px;row-gap:56px;align-items:start}
.contact .cform{grid-column:3;max-width:460px}
.fld{box-sizing:border-box;width:100%;min-height:44px;padding:10px 12px;border:0.5px solid #b5b5b5;border-radius:0;background:#fff;color:#1e1e1e;font:inherit;font-size:16px}
.fld:focus{outline:none;border-color:#1e1e1e}
.fld::placeholder{color:#9a9a9a}
textarea.fld{resize:vertical}
.send{align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;padding:0 20px;background:#1e1e1e;color:#fff !important;font-family:'DM Mono',ui-monospace,monospace;font-size:14px;text-transform:uppercase;letter-spacing:0.02em}
.send:hover{opacity:.8}
.svc5{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));column-gap:16px;row-gap:28px;align-items:start}
.infobtn{margin-left:18px;color:#1e1e1e;text-transform:uppercase;letter-spacing:0.02em;border-bottom:0.5px solid #1e1e1e;line-height:18px}
.infocard{position:absolute;top:16px;left:16px;bottom:16px;width:min(440px,46%);box-sizing:border-box;overflow:auto;padding:26px 28px 22px;display:flex;flex-direction:column;gap:18px;background:rgba(246,245,241,0.86);-webkit-backdrop-filter:blur(7px) saturate(0.9);backdrop-filter:blur(7px) saturate(0.9);color:#1e1e1e;box-shadow:0 2px 24px rgba(0,0,0,0.10);transition:opacity .28s ease,transform .28s ease,visibility .28s;z-index:3;scrollbar-width:none}
.infocard::-webkit-scrollbar{display:none}
.ic-head{display:flex;justify-content:space-between;gap:16px;font-family:'DM Mono',ui-monospace,monospace;font-size:13px;line-height:18px;text-transform:uppercase;letter-spacing:0.02em}
.ic-lab{font-family:'DM Mono',ui-monospace,monospace;font-size:12px;line-height:16px;text-transform:uppercase;letter-spacing:0.04em;color:#6b6b6b;margin-bottom:6px}
.ic-sec p{margin:0;font-size:15px;line-height:20px;font-weight:500;text-transform:uppercase;letter-spacing:0.005em;text-wrap:pretty}
.ic-foot{margin-top:auto;font-family:'DM Mono',ui-monospace,monospace;font-size:12px;color:#6b6b6b}
@media (max-width:1000px){.svc5{grid-template-columns:repeat(3,minmax(0,1fr))}}
.logo .cut{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:top;transition:max-width .6s cubic-bezier(.65,0,.35,1)}
.logo .w{display:inline-flex;align-items:flex-start}
html,body{overflow-x:clip;max-width:100%}
@media (max-width:720px){
footer.grid3{grid-template-columns:minmax(0,1fr);row-gap:6px}
footer.grid3>div:nth-child(2){display:none}
footer a{overflow-wrap:anywhere}
header.grid3{grid-template-columns:minmax(0,1fr) auto;row-gap:18px;padding:16px 16px 14px !important}
header.grid3>div:first-child{grid-column:1 / -1}
header.grid3{font-size:12.5px !important;letter-spacing:0 !important;column-gap:14px !important}
header.grid3>nav{justify-self:start;flex-direction:column;align-items:flex-start;gap:6px !important;white-space:nowrap}
header.grid3>nav>span{display:none !important}
header.grid3>nav>button:not(:last-child)::after{content:','}
header.grid3>div:last-child{align-self:start}
header.grid3>div:last-child>div{gap:5px !important}
header.grid3>div:last-child{justify-content:flex-end !important}
.desk{display:none !important}
.mob{display:inline !important}
main{padding:0 16px !important}
.home-sec{padding-top:64px !important}
footer.grid3{padding:16px 16px calc(28px + env(safe-area-inset-bottom)) !important}
.logo{font-size:17px !important}
.about,.lists{grid-template-columns:minmax(0,1fr)}
.about .txt{grid-column:auto}
.contact{grid-template-columns:minmax(0,1fr)}
.contact .cform{grid-column:auto;margin-left:0;max-width:none}
.svc5{grid-template-columns:repeat(2,minmax(0,1fr))}
.info{grid-template-columns:auto minmax(0,1fr);row-gap:8px}
.info .count{grid-column:2}
.code{text-align:left}
.lead{font-size:30px !important}
.lead,.about .txt p{white-space:pre-line}
.strip{height:calc((100vw - 32px) * 0.88 * 0.5625) !important}
.strip img{height:100% !important;width:auto !important;max-width:none !important;background:transparent !important}
.arr{width:40px !important;height:40px !important}
.infocard{position:fixed;top:auto;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:auto;max-height:72svh;padding:22px 20px 18px;gap:14px;z-index:20;background:rgba(244,243,239,0.92)}
.ic-sec p{font-size:14px;line-height:19px}
}
@media (max-width:380px){
header.grid3{font-size:11.5px !important;column-gap:12px !important}
.lead{font-size:27px !important}
}
</style>

</head>
<body>
<div id="root"></div>
<template id="tpl">
<div lang="{{lang}}" style="min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; box-sizing: border-box; background: #ffffff; color: #1e1e1e; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; font-size: 21px; line-height: 29px">

<header class="grid3" style="position: sticky; top: 0; z-index: 5; padding: 12px; align-items: center; font-family: 'DM Mono', ui-monospace, monospace; font-size: 14px; line-height: 20px; background: rgba(255,255,255,0.88); backdrop-filter: blur(8px); text-transform: uppercase; letter-spacing: 0.02em">
<div><button type="button" class="logo" onClick="{{goHome}}" aria-label="Noelia Orona" style="display: inline-flex; align-items: flex-start; gap: {{logoGap}}; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; font-size: 22px; line-height: 26px; text-transform: none; letter-spacing: -0.01em; white-space: nowrap; transition: gap .6s cubic-bezier(.65,0,.35,1)"><span class="w" aria-hidden="true"><span>N</span><span class="cut" style="max-width: {{restW}}">oelia</span><span class="cut" style="max-width: {{dotW}}">.</span></span><span class="w" aria-hidden="true"><span>O</span><span class="cut" style="max-width: {{restW}}">rona</span><span class="cut" style="max-width: {{dotW}}">.</span></span></button></div>
<nav aria-label="{{t.navLabel}}" style="display: flex; flex-wrap: wrap; gap: 4px">
<button type="button" onClick="{{goInfo}}" style="text-decoration: {{infoDeco}}">{{t.info}}</button><span aria-hidden="true">,</span>
<button type="button" onClick="{{goWork}}" style="text-decoration: {{workDeco}}">{{t.work}}</button><span class="mob" aria-hidden="true" style="display: none">,</span>
<button type="button" class="mob" onClick="{{goContact}}" style="display: none; text-decoration: {{contactDeco}}">{{t.contact}}</button>
</nav>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px">
<button type="button" class="desk" onClick="{{goContact}}" style="text-decoration: {{contactDeco}}">{{t.contact}}</button>
<div role="group" aria-label="Idioma / Language" style="display: flex; gap: 6px">
<button type="button" onClick="{{setEs}}" aria-pressed="{{isEs}}" style="color: {{esColor}}; text-decoration: {{esDeco}}">Español</button>
<span aria-hidden="true" style="color: #6b6b6b">/</span>
<button type="button" onClick="{{setEn}}" aria-pressed="{{isEn}}" style="color: {{enColor}}; text-decoration: {{enDeco}}">English</button>
</div>
</div>
</header>

<main style="flex: 1 1 auto; padding: 0 12px">

<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<section class="home-sec" style="padding-top: 112px">
<h1 class="lead" style="margin: 0; max-width: 820px; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 44px; line-height: 1.08; letter-spacing: -0.01em">{{t.lead}}</h1>
</section>
</sc-if>

<sc-if value="{{isWork}}" hint-placeholder-val="{{ false }}">
<section aria-label="{{t.work}}" style="padding: 48px 0 96px; display: flex; flex-direction: column; gap: 72px">
<sc-for list="{{projects}}" as="p" hint-placeholder-count="3">
<article style="display: flex; flex-direction: column; gap: 20px">
<div style="position: relative; width: 100%">
<div class="strip" onScroll="{{p.onScroll}}" tabindex="0" aria-label="{{p.title}}" style="display: flex; gap: 8px; width: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; height: clamp(240px, 58vh, 620px)">
<sc-for list="{{p.images}}" as="im" hint-placeholder-count="3">
<sc-if value="{{im.isImg}}" hint-placeholder-val="{{ true }}"><img src="{{im.src}}" alt="{{im.alt}}" loading="{{im.loading}}" draggable="false" style="display: block; flex: 0 0 auto; height: 100%; width: auto; object-fit: contain; background: #efefef; scroll-snap-align: start"></sc-if>
<sc-if value="{{im.isVideo}}" hint-placeholder-val="{{ false }}"><video src="{{im.src}}" autoplay="{{ true }}" muted="{{ true }}" loop="{{ true }}" playsInline="{{ true }}" preload="metadata" aria-label="{{im.alt}}" style="display: block; flex: 0 0 auto; height: 100%; aspect-ratio: 16 / 9; width: auto; object-fit: cover; background: #efefef; scroll-snap-align: start"></video></sc-if>
</sc-for>
</div>
<sc-if value="{{p.showPrev}}" hint-placeholder-val="{{ false }}">
<button type="button" class="arr" onClick="{{p.prev}}" aria-label="{{t.prevImg}}" style="left: 16px">←</button>
</sc-if>
<button type="button" class="arr" onClick="{{p.next}}" aria-label="{{t.nextImg}}" style="right: 16px">→</button>
<div class="infocard" role="dialog" aria-label="{{p.title}}" onClick="{{p.closeInfo}}" onPointerEnter="{{p.showInfo}}" onPointerLeave="{{p.hideInfo}}" style="opacity: {{p.infoOp}}; transform: {{p.infoTr}}; visibility: {{p.infoVis}}">
<div class="ic-head"><span>{{p.code3}}</span><span>{{p.title}}</span></div>
<div class="ic-sec"><div class="ic-lab">{{t.client}}</div><p>{{p.info.client}}</p></div>
<div class="ic-sec"><div class="ic-lab">{{t.challenge}}</div><p>{{p.info.challenge}}</p></div>
<div class="ic-sec"><div class="ic-lab">{{t.solution}}</div><p>{{p.info.solution}}</p></div>
<div class="ic-foot">by Noelia Orona</div>
</div>
</div>
<div class="info" style="font-size: 21px">
<div class="code" style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 14px; line-height: 23px; color: #767676">{{p.code}}</div>
<div style="font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.12; text-transform: uppercase">
<div>{{p.title}}</div>
<div>{{t.industry}}: {{p.industry}}</div>
<div>{{t.categories}}: {{p.categories}}</div>
<sc-if value="{{p.hasYear}}" hint-placeholder-val="{{ false }}"><div>{{t.year}}: {{p.year}}</div></sc-if>
</div>
<div class="count" style="display: flex; gap: 4px; font-family: 'DM Mono', ui-monospace, monospace; font-size: 14px; line-height: 23px; color: #767676">
<button type="button" onClick="{{p.prev}}" aria-label="{{t.prevImg}}">&lt;</button><span>{{p.counter}}</span><button type="button" onClick="{{p.next}}" aria-label="{{t.nextImg}}">&gt;</button>
<button type="button" class="infobtn" onClick="{{p.toggleInfo}}" onPointerEnter="{{p.showInfo}}" onPointerLeave="{{p.hideInfo}}" aria-expanded="{{p.infoAria}}">{{t.more}}<span aria-hidden="true" style="margin-left: 6px">{{p.infoSign}}</span></button>
</div>
</div>
</article>
</sc-for>
</section>
</sc-if>

<sc-if value="{{isInfo}}" hint-placeholder-val="{{ false }}">
<section style="padding: 56px 0 32px; display: flex; flex-direction: column; gap: 64px">
<div class="about">
<div class="txt" style="display: flex; flex-direction: column; gap: 20px; max-width: 720px; align-self: stretch">
<p style="margin: 0; text-wrap: pretty">{{t.about1}}</p>
<p style="margin: 0; text-wrap: pretty; color: #767676">{{t.about2}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 0 28px; margin-top: auto">
<a href="{{t.cv}}" target="_blank" rel="noopener" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-family: 'DM Mono', ui-monospace, monospace; font-size: 14px; line-height: 20px; text-transform: uppercase; letter-spacing: 0.02em; border-bottom: 0.5px solid #1e1e1e">CV <span aria-hidden="true">↗</span></a>
<a href="https://www.linkedin.com/in/noelia-orona-093a19181/" target="_blank" rel="noopener" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-family: 'DM Mono', ui-monospace, monospace; font-size: 14px; line-height: 20px; text-transform: uppercase; letter-spacing: 0.02em; border-bottom: 0.5px solid #1e1e1e">LinkedIn <span aria-hidden="true">↗</span></a>
</div>
</div>
<img src="assets/cc865a6dbeadcb29cce391f507c17738.jpg" alt="{{t.photoAlt}}" style="display: block; width: 100%; max-width: 340px; height: auto; aspect-ratio: 1276 / 1233; object-fit: cover">
</div>
<div style="display: flex; flex-direction: column; gap: 16px; padding-top: 16px; border-top: 0.5px solid #b5b5b5">
<div style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 14px; line-height: 20px; text-transform: uppercase; letter-spacing: 0.02em">{{t.services}}</div>
<div class="svc5">
<sc-for list="{{t.servicesAll}}" as="g" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 13px; line-height: 18px; color: #767676">{{g.nn}}</span>
<span style="font-size: 17px; line-height: 22px; font-weight: 500">{{g.name}}</span>
<div style="display: flex; flex-direction: column; font-size: 15px; line-height: 21px; color: #767676">
<sc-for list="{{g.subs}}" as="s" hint-placeholder-count="0"><span>{{s}}</span></sc-for>
</div>
</div>
</sc-for>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{isContact}}" hint-placeholder-val="{{ false }}">
<section style="padding: 56px 0 64px">
<div class="contact">
<div style="display: flex; flex-direction: column; gap: 80px">
<p style="margin: 0; text-wrap: pretty">{{t.contactIntro}}</p>
<div style="display: flex; flex-direction: column; gap: 4px; font-family: 'DM Mono', ui-monospace, monospace; font-size: 14px; line-height: 20px; text-transform: uppercase; letter-spacing: 0.02em">
<a href="mailto:nnorona15@gmail.com">→ nnorona15@gmail.com</a>
<a href="{{t.cv}}" target="_blank" rel="noopener">→ CV ↗</a>
<a href="https://www.linkedin.com/in/noelia-orona-093a19181/" target="_blank" rel="noopener">→ LinkedIn ↗</a>
</div>
</div>
<form class="cform" onSubmit="{{onSubmit}}" style="display: flex; flex-direction: column; gap: 22px; font-size: 16px; line-height: 23px">
<div style="display: flex; flex-direction: column; gap: 10px; font-family: 'DM Mono', ui-monospace, monospace; font-size: 14px; line-height: 20px">
<div style="text-transform: uppercase; letter-spacing: 0.02em; color: #767676">{{t.formTitle}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-name" style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 13px">{{t.fName}}*</label>
<input id="f-name" class="fld" type="text" autocomplete="name" value="{{f.name}}" onChange="{{onName}}">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-email" style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 13px">{{t.fEmail}}*</label>
<input id="f-email" class="fld" type="email" autocomplete="email" value="{{f.email}}" onChange="{{onEmail}}">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-type" style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 13px">{{t.fType}}*</label>
<select id="f-type" class="fld" value="{{f.type}}" onChange="{{onType}}" data-options="{{typeOptions}}" data-ph="{{t.fTypePh}}"></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-budget" style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 13px">{{t.fBudget}}</label>
<input id="f-budget" class="fld" type="text" placeholder="{{t.fBudgetPh}}" value="{{f.budget}}" onChange="{{onBudget}}">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-msg" style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 13px">{{t.fMessage}}*</label>
<textarea id="f-msg" class="fld" rows="5" placeholder="{{t.fMessagePh}}" value="{{f.message}}" onChange="{{onMessage}}"></textarea>
</div>
<sc-if value="{{formReady}}" hint-placeholder-val="{{ false }}">
<a href="{{mailtoHref}}" class="send">{{t.send}} →</a>
</sc-if>
<sc-if value="{{formNotReady}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<button type="submit" class="send" style="opacity: 0.4; cursor: default">{{t.send}} →</button>
<span style="font-family: 'DM Mono', ui-monospace, monospace; font-size: 13px; color: #767676">{{t.sendHint}}</span>
</div>
</sc-if>
</form>
</div>
</section>
</sc-if>

</main>

<footer class="grid3" style="padding: 12px; font-family: 'DM Mono', ui-monospace, monospace; font-size: 14px; line-height: 20px; text-transform: uppercase; letter-spacing: 0.02em">
<div style="display: flex; flex-wrap: wrap; gap: 0 20px"><span>Bs As, Argentina</span><span>©2026</span></div>
<div></div>
<div><a href="mailto:nnorona15@gmail.com">→ nnorona15@gmail.com</a></div>
</footer>
</div>
</template>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'home', lang: 'es', slides: {} };
  }
  go(view) {
    this.setState({ view: view });
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  renderVals() {
    var self = this;
    var view = this.state.view;
    var lang = this.state.lang;
    var es = lang === 'es';
    var T = {
      es: {
        navLabel: 'Principal', info: 'Sobre mí', work: 'Proyectos', contact: 'Contacto',
        lead: 'Diseñadora con más de 5 años de experiencia\n—\u00a0enfocada en desarrollar identidades y experiencias visuales que combinan concepto, sensibilidad y una mirada contemporánea.',
        industry: 'Rubro', categories: 'Categorías', more: 'Info', client: 'Cliente', challenge: 'Desafío', solution: 'Solución', year: 'Año', image: 'Imagen',
        nextImg: 'Imagen siguiente', prevImg: 'Imagen anterior',
        about1: 'Mi nombre es Noelia Orona. Diseñadora\u00a0con\u00a0base en Argentina, con más de 5 años de experiencia\n—\u00a0enfocada en desarrollar identidades y experiencias visuales que combinan concepto, sensibilidad y una mirada contemporánea.', about2: 'Trabajo desde un enfoque estratégico y conceptual, combinando investigación, criterio visual y comprensión de los objetivos de comunicación para desarrollar soluciones claras, coherentes y relevantes.',
        photoAlt: 'Retrato de Noelia Orona',
        cv: 'https://acrobat.adobe.com/id/urn:aaid:sc:US:c2e7ccbb-954d-4a64-97fe-b3108166860c',
        services: 'Servicios', servicesList: [
          { n: 1, name: 'Dirección de arte', subs: [] },
          { n: 2, name: 'Diseño de marca', subs: ['Estrategia de marca', 'Identidad visual', 'Diseño de logo', 'Manual de marca', 'Campañas de marca'] },
          { n: 3, name: 'Diseño editorial', subs: ['Libros y revistas', 'Folletos y publicaciones', 'Pósters y flyers', 'Brochures', 'Presentaciones comerciales'] },
          { n: 4, name: 'Diseño de packaging', subs: [] },
          { n: 5, name: 'Diseño web y digital', subs: ['Diseño de sitios web', 'Campañas digitales', 'Campañas para redes sociales'] },
          { n: 6, name: 'Colaboraciones', subs: ['Estudios y agencias', 'Proyectos colaborativos', 'Diseño freelance'] }
        ],
